<!doctype html>
<meta charset="utf-8">
<style>
@font-face { font-family: Silk; src: url(fonts/Silkscreen.woff2); }
@font-face { font-family: VT; src: url(fonts/VT323.woff2); }
body { margin: 0; background: #000; }
canvas { display: block; }
</style>
<canvas id="hi"></canvas>
<script>
const MODE = new URLSearchParams(location.search).get('mode') || 'world';
const THEME = new URLSearchParams(location.search).get('theme') || 'day';
const THEMES = {
  day: { paper: '#ffffff', sky: ['#5b86d6', '#5b86d6'], cloud: '#ffffff', skyline: ['#86a9c4', '#7c9fbd', '#9dbbd4', '#c9d7f2'],
    greens: ['#16302a', '#1f3d31', '#2c5a3e', '#3f7349', '#5b9156'], bcolors: ['#4b7a86', '#5b6e8c', '#3f6878', '#557e6a', '#6d7f99'],
    roof: ['#a8665a', '#9b5a50', '#6e3f3a'], street: '#2f3f48', pattern: null, wallTint: null },
  sunset: { paper: '#fff1dc', sky: ['#8a6bb8', '#f39a7a'], cloud: '#fff1dc', skyline: ['#c89aa8', '#b88ca6', '#e2b6b8', '#ffe2a8'],
    greens: ['#2a2a3e', '#3b3a52', '#5a4f6a', '#7d6a82', '#a08aa0'], bcolors: ['#7a5f8a', '#a0607a', '#5f5a8a', '#8a6a7a', '#6a7aa0'],
    roof: ['#3f3a5a', '#34304c', '#211d33'], street: '#3a3048', pattern: 'stripes', wallTint: '#ffb070' },
  night: { paper: '#18233a', sky: ['#18233a', '#22304d'], cloud: '#4a5f86', stars: true, rain: true, skyline: ['#24344f', '#2b3d5a', '#33476a', '#f3c96a'],
    greens: ['#0b1a17', '#10241e', '#173428', '#21463a', '#2f5e4a'], bcolors: ['#2f4c5e', '#3a4566', '#284556', '#33524a', '#43506a'],
    roof: ['#5a3a44', '#4a2f3a', '#2a1a22'], street: '#1a2430', pattern: 'dots', wallTint: '#ff9a40', night: true },
  spring: { paper: '#fdf6ee', sky: ['#8fc3ee', '#b9dbf5'], cloud: '#fdf6ee', skyline: ['#c9dcea', '#bdd2e4', '#dde9f3', '#ffffff'],
    greens: ['#7a3f62', '#b8618a', '#e08aae', '#f5b3cc', '#ffe0ec'], bcolors: ['#e3a9ad', '#9fcdb8', '#e9cf8f', '#aab9e6', '#cdb4e0'],
    roof: ['#6f86c0', '#5f75ad', '#3f4f80'], street: '#6a7486', pattern: 'stripes', wallTint: null, pastel: true },
};
const T = THEMES[THEME];
let W, H, S, buf, skyMask, texts, CLIP, L;
let VX, VY, VW, VH, GROUND;
function Layer(w, h, s, opaque, geo) { return { W: w, H: h, S: s, buf: new Array(w * h).fill(opaque ? '#1c3553' : null), sky: new Uint8Array(w * h), texts: [], geo }; }
function use(l) { L = l; ({ W, H, S, buf } = l); skyMask = l.sky; texts = l.texts; [VX, VY, VW, VH, GROUND] = l.geo; CLIP = l.clip; }

// ---------- pixel primitives ----------
function px(x, y, c) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H || !c) return; if (CLIP && (x < CLIP[0] || y < CLIP[1] || x >= CLIP[2] || y >= CLIP[3])) return; buf[y * W + x] = c; skyMask[y * W + x] = 0; }
function rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(x + i, y + j, c); }
function hline(x, y, w, c) { rect(x, y, w, 1, c); }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(7);
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const text = (str, x, y, opt = {}) => texts.push({ str, x, y, ...opt });

// ---------- characters (procedural chibi sprites, auto-outlined) ----------
function makeChar(c, pose = 'stand') {
  const w = 16, h = 24, g = Array.from({ length: h }, () => Array(w).fill(null));
  const set = (x, y, k) => { if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = k; };
  const fill = (x, y, ww, hh, k) => { for (let j = 0; j < hh; j++) for (let i = 0; i < ww; i++) set(x + i, y + j, k); };
  if (c.style === 'long') fill(2, 4, 12, 14, 'h');
  // body
  fill(7, 12, 2, 1, 's');
  fill(4, 13, 8, 6, 't'); fill(10, 13, 2, 6, 'T');
  if (pose === 'shocked') {
    fill(2, 8, 1, 5, 't'); fill(13, 8, 1, 5, 't'); set(2, 7, 's'); set(13, 7, 's');
  } else if (pose === 'forward') {
    fill(3, 13, 1, 4, 't'); fill(12, 13, 1, 4, 'T'); set(4, 17, 't'); set(11, 17, 'T'); set(5, 18, 's'); set(10, 18, 's');
  } else if (pose === 'stir') {
    fill(3, 13, 1, 5, 't'); set(3, 18, 's'); fill(12, 14, 3, 1, 'T'); set(15, 14, 's');
  } else if (pose === 'wave') {
    fill(3, 13, 1, 5, 't'); set(3, 18, 's'); fill(12, 9, 1, 5, 'T'); set(12, 8, 's'); set(13, 8, 's');
  } else {
    fill(3, 13, 1, 5, 't'); fill(12, 13, 1, 5, 'T'); set(3, 18, 's'); set(12, 18, 's');
  }
  fill(5, 19, 6, 3, 'p'); fill(7, 21, 2, 1, null);
  fill(4, 22, 3, 1, 'b'); fill(9, 22, 3, 1, 'b');
  // head
  fill(4, 2, 8, 1, 's'); fill(3, 3, 10, 8, 's'); fill(4, 11, 8, 1, 's'); fill(11, 4, 2, 7, 'S');
  // hair
  fill(5, 1, 6, 1, 'h'); fill(4, 2, 8, 1, 'h'); fill(3, 3, 10, 2, 'h'); set(6, 2, 'H'); set(7, 2, 'H'); set(5, 3, 'H');
  fill(3, 5, 4, 1, 'h'); set(12, 5, 'h');
  if (c.style === 'bob') { fill(2, 3, 1, 9, 'h'); fill(13, 3, 1, 9, 'h'); fill(3, 5, 1, 6, 'h'); fill(12, 5, 1, 6, 'h'); }
  if (c.style === 'spiky') { set(4, 0, 'h'); set(7, 0, 'H'); set(10, 0, 'h'); fill(4, 1, 8, 1, 'h'); set(3, 2, 'h'); set(12, 2, 'h'); set(3, 6, 'h'); set(12, 6, 'h'); }
  if (c.style === 'bun') { fill(6, 0, 4, 2, 'h'); set(7, 0, 'H'); }
  if (c.style === 'long') { fill(2, 3, 1, 14, 'h'); fill(13, 3, 1, 14, 'h'); fill(3, 5, 1, 4, 'h'); fill(12, 5, 1, 4, 'h'); }
  if (c.style === 'curly') { fill(2, 2, 12, 3, 'h'); set(2, 1, 'h'); set(5, 0, 'h'); set(9, 0, 'h'); set(13, 1, 'h'); fill(4, 1, 8, 1, 'h'); fill(2, 5, 1, 4, 'h'); fill(13, 5, 1, 4, 'h'); set(8, 1, 'H'); }
  // face
  if (pose === 'sleep') { fill(5, 7, 2, 1, 'e'); fill(9, 7, 2, 1, 'e'); }
  else { fill(5, 6, 1, 2, 'e'); fill(10, 6, 1, 2, 'e'); }
  set(4, 8, 'm'); set(11, 8, 'm');
  if (pose === 'shocked') { fill(7, 9, 2, 2, 'M'); } else { fill(7, 9, 2, 1, 'M'); }
  // outline
  const o = g.map((r) => r.slice());
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (g[y][x]) continue;
    if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => g[y + dy]?.[x + dx])) o[y][x] = 'o';
  }
  return o;
}
function palette(c) {
  return { o: '#1a1622', h: c.hair, H: mix(c.hair, '#ffffff', 0.35), s: c.skin, S: mix(c.skin, '#5a2c3a', 0.18), e: '#1a1622', m: mix(c.skin, '#ff6f8a', 0.45), M: '#9b3b4f', t: c.top, T: mix(c.top, '#101020', 0.3), p: c.pants, b: '#2a2230' };
}
function drawChar(c, x, y, pose, { rot = false, rows = 24 } = {}) {
  const g = makeChar(c, pose), pal = palette(c);
  for (let j = 0; j < rows; j++) for (let i = 0; i < 16; i++) {
    const k = g[j][i]; if (!k) continue;
    if (rot) px(x + j, y + 15 - i, pal[k]); else px(x + i, y + j, pal[k]);
  }
}
function miniHead(c, x, y) { drawChar(c, x, y, 'stand', { rows: 13 }); }

const PEOPLE = {
  asha: { name: 'ASHA', skin: '#c98d6a', hair: '#2b1d2e', style: 'bob', top: '#e86a5a', pants: '#3b4a6b' },
  ben: { name: 'BEN', skin: '#f1c7a5', hair: '#7ed957', style: 'spiky', top: '#3d6fb6', pants: '#2f3550' },
  chen: { name: 'CHEN', skin: '#f0cfa0', hair: '#1f1a24', style: 'bun', top: '#5fb08e', pants: '#4a3f5c' },
  dani: { name: 'DANI', skin: '#6b4430', hair: '#e8dff5', style: 'long', top: '#26222e', pants: '#3a3448' },
  me: { name: 'YOU', skin: '#a8714f', hair: '#3a2418', style: 'curly', top: '#f2b84b', pants: '#3b4a6b' },
};

// ---------- dialogue boxes (ref 1) and vote bubbles (ref 4) ----------
function boxShape(x, y, w, h, fillC, border = '#14101c') {
  hline(x + 1, y, w - 2, border); hline(x + 1, y + h - 1, w - 2, border);
  rect(x, y + 1, 1, h - 2, border); rect(x + w - 1, y + 1, 1, h - 2, border);
  rect(x + 1, y + 1, w - 2, h - 2, fillC);
}
function dialog(x, y, w, h, tailX, { tail = 'down', shadow = '#3bb5b0' } = {}) {
  boxShape(x + 2, y + 2, w, h, shadow, shadow);
  boxShape(x, y, w, h, '#ffffff');
  rect(x + 2, y + h - 4, 2, 2, '#f39ac0'); rect(x + 5, y + h - 4, 2, 2, '#9ad0f3'); rect(x + 8, y + h - 4, 2, 2, '#f39ac0');
  if (tail === 'down') {
    for (let j = 0; j < 4; j++) { rect(tailX - 3 + j, y + h - 1 + j, 7 - 2 * j, 1, '#ffffff'); px(tailX - 4 + j, y + h - 1 + j, '#14101c'); px(tailX + 4 - j, y + h - 1 + j, '#14101c'); }
    px(tailX, y + h + 3, '#14101c');
  } else if (tail === 'left') {
    for (let j = 0; j < 3; j++) { rect(x - j, y + 6 + j, 1, 5 - 2 * j, '#ffffff'); px(x - j, y + 5 + j, '#14101c'); px(x - j, y + 11 - j, '#14101c'); }
    px(x - 3, y + 8, '#14101c');
  }
}
const FONT_BODY = '30px VT', FONT_HEAD = '16px Silk';
function measure(lines, font) { const ctx = document.createElement('canvas').getContext('2d'); ctx.font = font; return Math.max(...lines.map((l) => ctx.measureText(l).width)); }
function wrap(str, maxPx) {
  const ctx = document.createElement('canvas').getContext('2d'); ctx.font = FONT_BODY;
  const out = []; let line = '';
  for (const word of str.split(' ')) { const t = line ? line + ' ' + word : word; if (ctx.measureText(t).width > maxPx && line) { out.push(line); line = word; } else line = t; }
  out.push(line); return out;
}
// speech box anchored so its tail points at (ax, ay)
function speech(header, msg, ax, ay, { maxW = 78, color = '#e0457b' } = {}) {
  const lines = wrap(msg, maxW * S - 24);
  const wHi = Math.max(measure(lines, FONT_BODY), measure([header], FONT_HEAD)) + 24;
  const w = Math.ceil(wHi / S), h = Math.ceil((14 + 18 + lines.length * 24 + 14) / S);
  let x = Math.round(ax - w / 2); x = Math.max(6, Math.min(x, 392 - w));
  const y = ay - h - 4;
  dialog(x, y, w, h, ax);
  text(header, x * S + 12, y * S + 22, { font: FONT_HEAD, color });
  lines.forEach((l, i) => text(l, x * S + 12, y * S + 46 + i * 24, { font: FONT_BODY, color: '#2a2440' }));
}
function voteBubble(x, y, who) {
  boxShape(x + 1, y + 1, 20, 17, '#3bb5b0', '#3bb5b0');
  boxShape(x, y, 20, 17, '#ffffff');
  for (let j = 0; j < 3; j++) { rect(x - j, y + 6 + j, 1, 5 - 2 * j, '#ffffff'); px(x - j, y + 5 + j, '#14101c'); px(x - j, y + 11 - j, '#14101c'); }
  px(x - 3, y + 8, '#14101c');
  miniHead(PEOPLE[who], x + 2, y + 2);
}

// ---------- scene ----------


function drawSky() {
  for (let y = VY; y < VY + VH; y++) for (let x = VX; x < VX + VW; x++) {
    const ly = (y - VY) / VH;
    const n = noise(x / 34, y / 13) * 0.65 + noise(x / 13, y / 6) * 0.35;
    const cloud = Math.min(1, Math.max(0, (n - 0.5) / 0.22));
    const d = 0.95 - ly * 0.55 - cloud * 1.05;
    const on = d * 16 > BAYER[y % 4][x % 4];
    const skyC = (ly * 16 > BAYER[(y + 2) % 4][(x + 1) % 4]) ? T.sky[1] : T.sky[0];
    let c = on ? skyC : T.cloud;
    if (T.stars && on && hash(x, y) > 0.985) c = '#f2f0c8';
    buf[y * W + x] = c;
    skyMask[y * W + x] = 1;
  }
}
function drawSkyline() {
  const r = rng(3);
  let x = VX - 4;
  while (x < VX + VW) {
    const w = 10 + Math.floor(r() * 22), h = 90 + Math.floor(r() * 40);
    const c = r() < 0.5 ? T.skyline[0] : T.skyline[1];
    rect(x, GROUND - h, w, h, c);
    for (let wy = GROUND - h + 3; wy < GROUND - 6; wy += 5) for (let wx = x + 2; wx < x + w - 2; wx += 4) {
      const k = r(); const wc = k < 0.12 ? T.skyline[3] : k < 0.5 ? T.skyline[2] : c; px(wx, wy, wc); px(wx + 1, wy, wc);
    }
    x += w + Math.floor(r() * 3);
  }
}
function drawTrees(seed, y0, density = 1) {
  const r = rng(seed);
  const greens = T.greens;
  for (let i = 0; i < 260 * density; i++) {
    const cx = VX + r() * VW, cy = y0 + r() * (GROUND - y0), rad = 3 + r() * 6;
    for (let yy = -rad; yy <= rad; yy++) for (let xx = -rad; xx <= rad; xx++) {
      if (xx * xx + yy * yy > rad * rad) continue;
      const shade = Math.min(4, Math.max(0, Math.floor((1 - (yy + rad) / (2 * rad)) * 3 + r() * 2.2)));
      if (r() < 0.82) px(cx + xx, cy + yy, greens[shade]);
    }
  }
}
function windows(bx, by, bw, bh, avoid, seed, night) {
  const r = rng(seed);
  for (let y = by + 4; y < by + bh - 8; y += 9) for (let x = bx + 4; x < bx + bw - 7; x += 8) {
    if (avoid.some((a) => x + 6 > a.x && x < a.x + a.w && y + 7 > a.y && y < a.y + a.h)) continue;
    const lit = (night || T.night) ? r() < (T.night ? 0.6 : 0.45) : r() < 0.1;
    rect(x, y, 5, 6, '#22313c'); rect(x + 1, y + 1, 3, 4, lit ? '#f3d98a' : night ? '#3a4b66' : '#9fc3dc');
    if (!lit && !night) px(x + 1, y + 1, '#d6e8f5');
  }
}
function building(b) {
  const top = GROUND - b.h;
  if (b.roof) {
    for (let j = 0; j < 12; j++) rect(b.x - 2 + Math.max(0, 11 - j) * 2 + 0, top - 12 + j, b.w + 4 - Math.max(0, 11 - j) * 4, 1, j === 11 ? T.roof[2] : (j % 3 === 0 ? T.roof[1] : T.roof[0]));
  } else {
    rect(b.x - 1, top - 2, b.w + 2, 2, mix(b.color, '#101820', 0.4));
  }
  rect(b.x, top, b.w, b.h, b.color);
  rect(b.x + b.w - 3, top, 3, b.h, mix(b.color, '#101820', 0.25));
  const room = { x: b.x + 5, y: top + 5, w: b.w - 10, h: 40 };
  const plate = { x: b.x + 4, y: room.y + room.h + 3, w: b.w - 8, h: 7 };
  windows(b.x, top, b.w - 3, b.h, [{ x: room.x - 2, y: room.y - 2, w: room.w + 4, h: room.h + 4 }, plate], b.seed, b.night);
  // door
  rect(b.x + Math.floor(b.w / 2) - 4, GROUND - 12, 8, 12, '#2a2230'); rect(b.x + Math.floor(b.w / 2) - 3, GROUND - 11, 6, 11, '#6d4c3d');
  // cut-away room frame
  rect(room.x - 2, room.y - 2, room.w + 4, room.h + 4, mix(b.color, '#0b1018', 0.55));
  rect(room.x, room.y, room.w, room.h - 4, b.wall);
  if (T.pattern === 'stripes') for (let x = room.x + 1; x < room.x + room.w; x += 4) rect(x, room.y, 1, room.h - 4, mix(b.wall, '#ffffff', 0.35));
  if (T.pattern === 'dots') for (let y = room.y + 2; y < room.y + room.h - 6; y += 4) for (let x = room.x + 2 + (y % 8 ? 2 : 0); x < room.x + room.w; x += 4) px(x, y, mix(b.wall, '#000000', 0.12));
  rect(room.x, room.y + room.h - 4, room.w, 4, b.floor);
  if (T.pattern) { rect(room.x + 14, room.y + room.h - 2, 22, 2, b.rug || '#c85a7a'); for (let x = room.x + 15; x < room.x + 35; x += 3) px(x, room.y + room.h - 1, '#ffe0a0'); }
  hline(room.x, room.y + room.h - 4, room.w, mix(b.floor, '#000', 0.25));
  // location plate
  rect(plate.x, plate.y, plate.w, plate.h, '#1c2a35');
  text(b.tag, plate.x * S + (S === 4 ? 6 : 4), plate.y * S + (S === 4 ? 22 : 11), { font: S === 4 ? '16px Silk' : '9px Silk', color: '#e8f0ff' });
  return { ...room, floorY: room.y + room.h - 4, top };
}
function windowPane(x, y, w, h, sky, extra) {
  rect(x - 1, y - 1, w + 2, h + 2, '#5a4a3e'); rect(x, y, w, h, sky);
  rect(x + Math.floor(w / 2), y, 1, h, '#5a4a3e'); extra?.();
}
function lamp(x, y, on = true) { rect(x, y, 1, 4, '#3a3040'); rect(x - 2, y + 4, 5, 2, on ? '#f6e3a1' : '#55506a'); if (on) { px(x - 3, y + 6, '#fff5d0'); px(x + 3, y + 6, '#fff5d0'); } }

// ---------- frame (ref 2) and control bar (ref 3, original design) ----------
function frame(title) {
  rect(0, 0, W, H, '#1c3553');
  rect(2, 2, W - 4, 13, '#6e93b9');
  hline(2, 2, W - 4, '#8fb0d2');
  rect(5, 4, 7, 9, '#f2f5fb'); rect(10, 4, 2, 2, '#c5d0e3'); hline(6, 8, 4, '#c5d0e3'); hline(6, 10, 4, '#c5d0e3');
  text(title, 16 * S, 13 * S, { font: '40px Silk', color: '#dfe8ff' });
  const btn = (x, icon) => { rect(x, 3, 11, 11, '#a7b5a8'); icon(x); };
  btn(359, (x) => rect(x + 3, 10, 5, 2, '#1b2a33'));
  btn(372, (x) => { rect(x + 2, 4, 7, 7, '#1b2a33'); rect(x + 3, 6, 5, 4, '#a7b5a8'); });
  btn(385, (x) => { for (let i = 0; i < 6; i++) { rect(x + 2 + i, 4 + i, 2, 1, '#1b2a33'); rect(x + 7 - i, 4 + i, 2, 1, '#1b2a33'); } });
  rect(VX - 1, VY - 1, VW + 2, VH + 2, '#2c5078');
}
function bevel(x, y, w, h, c = '#c3c6cf', pressed = false) {
  rect(x, y, w, h, c);
  hline(x, y, w, pressed ? '#6c707b' : '#f4f5f8'); rect(x, y, 1, h, pressed ? '#6c707b' : '#f4f5f8');
  hline(x, y + h - 1, w, pressed ? '#f4f5f8' : '#6c707b'); rect(x + w - 1, y, 1, h, pressed ? '#f4f5f8' : '#6c707b');
}
const ICONS = {
  prev: ['..#...#', '.##..##', '###.###', '.##..##', '..#...#'],
  next: ['#...#..', '##..##.', '###.###', '##..##.', '#...#..'],
  rec: ['.###.', '#####', '#####', '#####', '.###.'],
  heart: ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'],
  pad: ['.#####.', '#.#####', '###.#.#', '#.#####', '.##.##.'],
};
function icon(name, x, y, c) { ICONS[name].forEach((r, j) => [...r].forEach((ch, i) => ch === '#' && px(x + i, y + j, c))); }
ICONS.rose = ['.#.#.', '#####', '.###.', '..#..', '.##..', '..#..'];

async function render() {
  await document.fonts.load(FONT_BODY); await document.fonts.load(FONT_HEAD); await document.fonts.load('40px Silk'); await document.fonts.load('9px Silk');
  const layers = compose();
  const cv = document.getElementById('hi'); cv.width = 1600; cv.height = 900;
  const ctx = cv.getContext('2d');
  for (const l of layers) {
    for (let y = 0; y < l.H; y++) for (let x = 0; x < l.W; x++) {
      const c = l.buf[y * l.W + x]; if (!c) continue;
      const s = l.S;
      if (s === 2) { ctx.fillStyle = c; ctx.fillRect(x * 2, y * 2, 2, 2); continue; }
      if (l.sky[y * l.W + x]) {
        ctx.fillStyle = T.paper; ctx.fillRect(x * s, y * s, s, s);
        if (c !== T.paper) { ctx.fillStyle = c; ctx.fillRect(x * s, y * s, s - 1, s - 1); }
      } else {
        ctx.fillStyle = mix(c, '#000000', 0.12); ctx.fillRect(x * s, y * s, s, s);
        ctx.fillStyle = c; ctx.fillRect(x * s, y * s, s - 1, s - 1);
      }
    }
    for (const t of l.texts) { ctx.font = t.font; ctx.fillStyle = t.color; ctx.fillText(t.str, t.x, t.y); }
  }
  document.title = 'done';
}
render();
