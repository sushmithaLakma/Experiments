<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c3553">
<title>Friends Street</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap">
<style>
/* Layout: one 90s program window. Title bar, the scrolling pixel street, a scrollbar, then the control bar. Single deliberate look. */
:root {
  --desk: #9fbfe8;
  --desk-dot: #86a9d8;
  --navy: #1c3553;
  --navy-2: #2c5078;
  --title: #6e93b9;
  --title-hi: #8fb0d2;
  --title-text: #dfe8ff;
  --chrome: #c3c6cf;
  --chrome-bar: #b9bcc6;
  --bevel-hi: #f4f5f8;
  --bevel-lo: #6c707b;
  --ink: #1b2a33;
  --lcd: #122a22;
  --lcd-edge: #0e1f1a;
  --lcd-text: #8dffb0;
  --lcd-dim: #58c487;
  --paper: #ffffff;
  --paper-ink: #2a2440;
  --pink: #e0457b;
  --blue: #2c7fb8;
  --teal: #3bb5b0;
  --primary: #9fc0e8;
  --pixel: "Silkscreen", "Courier New", monospace;
  --term: "VT323", "Courier New", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--desk);
  background-image: radial-gradient(var(--desk-dot) 1.2px, transparent 1.4px);
  background-size: 6px 6px;
  color: var(--ink);
  font: 22px/1.15 var(--term);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

.win { max-width: 1240px; margin: 0 auto; background: var(--navy); padding: 6px; box-shadow: 8px 8px 0 #0f2238; }
.titlebar { display: flex; align-items: center; gap: 10px; background: var(--title); border-top: 3px solid var(--title-hi); padding: 6px 8px; min-width: 0; }
.doc-icon { width: 18px; height: 22px; background: #f2f5fb; flex: none; box-shadow: inset -5px 5px 0 #c5d0e3; }
.title { font: 400 clamp(15px, 2.6vw, 28px)/1 var(--pixel); color: var(--title-text); letter-spacing: 0.08em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border: 0; text-align: left; padding: 2px 0; }
.title[disabled] { cursor: default; }
.tb-btns { display: flex; gap: 6px; flex: none; }
.tb-btns i { width: 26px; height: 26px; background: #a7b5a8; display: grid; place-items: center; font: 14px var(--pixel); font-style: normal; color: var(--ink); }

.view { position: relative; margin-top: 6px; border: 3px solid var(--navy-2); background: #000; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
.view.dragging { cursor: grabbing; }
.view canvas { display: block; width: 100%; image-rendering: pixelated; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--navy); color: var(--title-text); font: 16px var(--pixel); letter-spacing: 0.1em; }

.scroll { display: flex; align-items: stretch; gap: 0; margin-top: 4px; height: 26px; }
.scroll button { width: 30px; background: var(--chrome); border: 2px solid; border-color: var(--bevel-hi) var(--bevel-lo) var(--bevel-lo) var(--bevel-hi); font: 12px var(--pixel); padding: 0; }
.scroll input { flex: 1; min-width: 0; margin: 0; appearance: none; -webkit-appearance: none; background: #a9acb6; border: 2px solid; border-color: var(--bevel-lo) var(--bevel-hi) var(--bevel-hi) var(--bevel-lo); height: 100%; }
.scroll input::-webkit-slider-thumb { -webkit-appearance: none; width: var(--thumb, 120px); height: 22px; background: var(--primary); border: 2px solid; border-color: var(--bevel-hi) var(--bevel-lo) var(--bevel-lo) var(--bevel-hi); }
.scroll input::-moz-range-thumb { width: var(--thumb, 120px); height: 18px; border-radius: 0; background: var(--primary); border: 2px solid; border-color: var(--bevel-hi) var(--bevel-lo) var(--bevel-lo) var(--bevel-hi); }

.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; background: var(--chrome-bar); padding: 8px; margin-top: 6px; border: 2px solid; border-color: var(--bevel-hi) var(--bevel-lo) var(--bevel-lo) var(--bevel-hi); }
.lcd { flex: 1 1 240px; min-width: 0; background: var(--lcd); border: 3px solid var(--lcd-edge); padding: 6px 10px; color: var(--lcd-text); }
.lcd small { display: block; font: 11px/1.4 var(--pixel); color: var(--lcd-dim); letter-spacing: 0.06em; text-transform: uppercase; }
.lcd span { display: block; font-size: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: stretch; }
.btn { font: 12px var(--pixel); letter-spacing: 0.04em; background: var(--chrome); border: 2px solid; border-color: var(--bevel-hi) var(--bevel-lo) var(--bevel-lo) var(--bevel-hi); padding: 6px 12px; color: var(--ink); display: inline-flex; gap: 8px; align-items: center; justify-content: center; min-height: 44px; text-transform: uppercase; }
.btn:active, .btn[aria-pressed="true"] { border-color: var(--bevel-lo) var(--bevel-hi) var(--bevel-hi) var(--bevel-lo); background: #b3b6c0; }
.btn.primary { background: var(--primary); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn img { width: 21px; height: 18px; image-rendering: pixelated; }
.btn.icon-only { width: 44px; padding: 0; }

.note { max-width: 1240px; margin: 10px auto 0; font: 11px/1.5 var(--pixel); color: #2c4a70; letter-spacing: 0.04em; }
.note button { font: inherit; background: none; border: 0; padding: 0; color: var(--navy); text-decoration: underline; }

/* dialog boxes, styled after the in-game speech boxes */
dialog.box { border: 3px solid #14101c; padding: 0; background: var(--paper); color: var(--paper-ink); box-shadow: 6px 6px 0 var(--teal); width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; }
dialog.box::backdrop { background: rgba(20, 30, 60, 0.45); }
.box-in { padding: 16px 18px 14px; display: grid; gap: 12px; }
.box h2 { margin: 0; font: 15px/1.3 var(--pixel); color: var(--pink); letter-spacing: 0.06em; text-transform: uppercase; }
.box h2.blue { color: var(--blue); }
.box p { margin: 0; font-size: 22px; line-height: 1.15; }
.box .muted { color: #6f6880; }
.dots { display: flex; gap: 4px; }
.dots i { width: 8px; height: 8px; background: #f39ac0; } .dots i:nth-child(2) { background: #9ad0f3; }
.field { display: grid; gap: 4px; }
.field label, .lbl { font: 11px var(--pixel); color: #6f6880; letter-spacing: 0.06em; text-transform: uppercase; }
.field input { border: 3px solid #14101c; background: #fff; padding: 6px 8px; font-size: 22px; width: 100%; }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pbtn { font: 12px var(--pixel); text-transform: uppercase; letter-spacing: 0.04em; border: 3px solid #14101c; background: #fff; padding: 8px 14px; min-height: 44px; display: inline-flex; gap: 8px; align-items: center; }
.pbtn.go { background: #ffd6e6; }
.pbtn.go.blue { background: #d6ecff; }
.pbtn:active { transform: translate(2px, 2px); }
.pbtn img { width: 21px; height: 18px; image-rendering: pixelated; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.chip { border: 3px solid #14101c; background: #fff; padding: 6px 4px; display: grid; justify-items: center; gap: 4px; font: 10px var(--pixel); text-transform: uppercase; min-height: 56px; }
.chip img { width: 28px; height: 24px; image-rendering: pixelated; }
.chip[aria-pressed="true"] { background: #ffd6e6; box-shadow: inset 0 0 0 2px var(--pink); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 34px; height: 34px; border: 3px solid #14101c; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--pink); }
.styles { display: flex; flex-wrap: wrap; gap: 6px; }
.styles .pbtn { min-height: 38px; padding: 4px 10px; }
.styles .pbtn[aria-pressed="true"] { background: #ffd6e6; }
.builder { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
.builder canvas { width: 96px; height: 144px; image-rendering: pixelated; background: #f3dcae; border: 3px solid #14101c; }
.friends { display: grid; gap: 6px; }
.friend { display: flex; align-items: center; gap: 10px; border: 3px solid #14101c; background: #fff; padding: 4px 8px; text-align: left; min-height: 44px; }
.friend[aria-pressed="true"] { background: #ffd6e6; }
.friend canvas { width: 32px; height: 26px; image-rendering: pixelated; }
@media (max-width: 420px) { .builder { grid-template-columns: 1fr; } .builder canvas { justify-self: center; } }

#toasts { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; z-index: 50; width: min(440px, calc(100vw - 32px)); pointer-events: none; }
.toast { background: #fff; border: 3px solid #14101c; box-shadow: 4px 4px 0 var(--teal); padding: 8px 12px; font-size: 21px; color: var(--paper-ink); animation: pop 0.2s steps(3); }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>
</head>
<body>
<div class="win">
  <div class="titlebar">
    <span class="doc-icon" aria-hidden="true"></span>
    <button class="title" id="title" disabled>FRIENDS_STREET.LYF</button>
    <span class="tb-btns" aria-hidden="true"><i>_</i><i>□</i><i>×</i></span>
  </div>
  <div class="view" id="view" tabindex="0" aria-label="Your friends' street. Drag or use the arrow keys to scroll, tap a house to visit.">
    <canvas id="cv"></canvas>
    <div class="loading" id="loading">LOADING STREET…</div>
  </div>
  <div class="scroll">
    <button id="sl" aria-label="Scroll left">◀</button>
    <input type="range" id="range" min="0" max="100" value="0" aria-label="Scroll the street">
    <button id="sr" aria-label="Scroll right">▶</button>
  </div>
  <div class="bar">
    <div class="lcd" aria-live="polite"><small id="lcd1">STARTING UP</small><span id="lcd2">…</span></div>
    <div class="btns">
      <button class="btn icon-only" id="prev" aria-label="Previous friend">◀◀</button>
      <button class="btn icon-only" id="next" aria-label="Next friend">▶▶</button>
      <button class="btn primary" id="update"><img alt="" data-icon="rec"> My update</button>
      <button class="btn" id="gift"><img alt="" data-icon="rose"> Gift</button>
      <button class="btn" id="drive" aria-pressed="false"><img alt="" data-icon="car"> Drive</button>
      <button class="btn" id="hi" hidden><img alt="" data-icon="heart"> Say hi</button>
      <button class="btn" id="sky">Sky: auto</button>
    </div>
  </div>
</div>
<p class="note" id="note"></p>
<ul class="sr" id="srlist" aria-label="Friends on this street"></ul>

<dialog class="box" id="dlg"><div class="box-in" id="dlgIn"></div></dialog>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
// =====================================================================
// Pixel engine: everything is drawn into a small logical pixel grid,
// then scaled up with a dot-screen filter.
// =====================================================================
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function strHash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const hexRGB = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const INT = new Map(), DARK = new Map();
function toInt(c) { let v = INT.get(c); if (v === undefined) { const [r, g, b] = hexRGB(c); v = ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0; INT.set(c, v); } return v; }
function darkInt(c) { let v = DARK.get(c); if (v === undefined) { v = toInt(mix(c, '#000000', 0.12)); DARK.set(c, v); } return v; }

class Pix {
  constructor(w, h) { this.w = w; this.h = h; this.c = new Array(w * h).fill(null); this.sky = new Uint8Array(w * h); this.texts = []; }
}
let P = null;
function px(x, y, c) { x |= 0; y |= 0; if (!c || x < 0 || y < 0 || x >= P.w || y >= P.h) return; const i = y * P.w + x; P.c[i] = c; P.sky[i] = 0; }
function rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(x + i, y + j, c); }
function hline(x, y, w, c) { rect(x, y, w, 1, c); }
function text(str, x, y, size, family, color) { P.texts.push({ str, x, y, size, family, color }); }

// Scale a Pix grid up by R onto a canvas. Sky pixels print as dots on paper; everything else gets a faint grid.
function toCanvas(pix, R, paper) {
  const cv = document.createElement('canvas'); cv.width = pix.w * R; cv.height = pix.h * R;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(cv.width, cv.height);
  const d = new Uint32Array(img.data.buffer), W = cv.width, gut = R >= 3;
  const paperI = paper ? toInt(paper) : 0;
  for (let y = 0; y < pix.h; y++) for (let x = 0; x < pix.w; x++) {
    const i = y * pix.w + x, c = pix.c[i]; if (!c) continue;
    const ci = toInt(c), gi = pix.sky[i] ? paperI : darkInt(c);
    const isPaper = pix.sky[i] && c === paper;
    for (let yy = 0; yy < R; yy++) {
      const row = (y * R + yy) * W + x * R;
      for (let xx = 0; xx < R; xx++) d[row + xx] = isPaper ? paperI : (gut && (xx === R - 1 || yy === R - 1)) ? gi : ci;
    }
  }
  ctx.putImageData(img, 0, 0);
  ctx.textBaseline = 'alphabetic';
  for (const t of pix.texts) { ctx.font = `${t.size * R}px ${t.family}`; ctx.fillStyle = t.color; ctx.fillText(t.str, t.x * R, t.y * R); }
  return cv;
}
const MEASURE = document.createElement('canvas').getContext('2d');
function measure(str, size, family) { MEASURE.font = `${size * 20}px ${family}`; return MEASURE.measureText(str).width / 20; }
const VT = '"VT323", monospace', SILK = '"Silkscreen", monospace';

// ---------- characters ----------
function makeChar(c, pose = 'stand') {
  const w = 16, h = 24, g = Array.from({ length: h }, () => Array(w).fill(null));
  const set = (x, y, k) => { if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = k; };
  const fill = (x, y, ww, hh, k) => { for (let j = 0; j < hh; j++) for (let i = 0; i < ww; i++) set(x + i, y + j, k); };
  if (c.style === 'long') fill(2, 4, 12, 14, 'h');
  fill(7, 12, 2, 1, 's');
  fill(4, 13, 8, 6, 't'); fill(10, 13, 2, 6, 'T');
  if (pose === 'shocked') { fill(2, 8, 1, 5, 't'); fill(13, 8, 1, 5, 't'); set(2, 7, 's'); set(13, 7, 's'); }
  else if (pose === 'forward' || pose.startsWith('walk')) { fill(3, 13, 1, 4, 't'); fill(12, 13, 1, 4, 'T'); set(4, 17, 't'); set(11, 17, 'T'); set(5, 18, 's'); set(10, 18, 's'); }
  else if (pose === 'stir') { fill(3, 13, 1, 5, 't'); set(3, 18, 's'); fill(12, 14, 3, 1, 'T'); set(15, 14, 's'); }
  else if (pose === 'wave') { fill(3, 13, 1, 5, 't'); set(3, 18, 's'); fill(12, 9, 1, 5, 'T'); set(12, 8, 's'); set(13, 8, 's'); }
  else { fill(3, 13, 1, 5, 't'); fill(12, 13, 1, 5, 'T'); set(3, 18, 's'); set(12, 18, 's'); }
  if (pose === 'walkA') { fill(5, 19, 6, 2, 'p'); fill(4, 21, 2, 1, 'p'); fill(10, 21, 2, 1, 'p'); fill(3, 22, 3, 1, 'b'); fill(10, 22, 3, 1, 'b'); }
  else if (pose === 'walkB') { fill(5, 19, 6, 3, 'p'); fill(5, 22, 3, 1, 'b'); fill(8, 22, 3, 1, 'b'); }
  else { fill(5, 19, 6, 3, 'p'); fill(7, 21, 2, 1, null); fill(4, 22, 3, 1, 'b'); fill(9, 22, 3, 1, 'b'); }
  fill(4, 2, 8, 1, 's'); fill(3, 3, 10, 8, 's'); fill(4, 11, 8, 1, 's'); fill(11, 4, 2, 7, 'S');
  fill(5, 1, 6, 1, 'h'); fill(4, 2, 8, 1, 'h'); fill(3, 3, 10, 2, 'h'); set(6, 2, 'H'); set(7, 2, 'H'); set(5, 3, 'H');
  fill(3, 5, 4, 1, 'h'); set(12, 5, 'h');
  if (c.style === 'bob') { fill(2, 3, 1, 9, 'h'); fill(13, 3, 1, 9, 'h'); fill(3, 5, 1, 6, 'h'); fill(12, 5, 1, 6, 'h'); }
  if (c.style === 'spiky') { set(4, 0, 'h'); set(7, 0, 'H'); set(10, 0, 'h'); fill(4, 1, 8, 1, 'h'); set(3, 2, 'h'); set(12, 2, 'h'); set(3, 6, 'h'); set(12, 6, 'h'); }
  if (c.style === 'bun') { fill(6, 0, 4, 2, 'h'); set(7, 0, 'H'); }
  if (c.style === 'long') { fill(2, 3, 1, 14, 'h'); fill(13, 3, 1, 14, 'h'); fill(3, 5, 1, 4, 'h'); fill(12, 5, 1, 4, 'h'); }
  if (c.style === 'curly') { fill(2, 2, 12, 3, 'h'); set(2, 1, 'h'); set(5, 0, 'h'); set(9, 0, 'h'); set(13, 1, 'h'); fill(4, 1, 8, 1, 'h'); fill(2, 5, 1, 4, 'h'); fill(13, 5, 1, 4, 'h'); set(8, 1, 'H'); }
  if (pose === 'sleep') { fill(5, 7, 2, 1, 'e'); fill(9, 7, 2, 1, 'e'); } else { fill(5, 6, 1, 2, 'e'); fill(10, 6, 1, 2, 'e'); }
  set(4, 8, 'm'); set(11, 8, 'm');
  if (pose === 'shocked') fill(7, 9, 2, 2, 'M'); else fill(7, 9, 2, 1, 'M');
  const o = g.map((r) => r.slice());
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (g[y][x]) continue;
    if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => g[y + dy]?.[x + dx])) o[y][x] = 'o';
  }
  return o;
}
function palette(c) {
  return { o: '#1a1622', h: c.hair, H: mix(c.hair, '#ffffff', 0.35), s: c.skin, S: mix(c.skin, '#5a2c3a', 0.18), e: '#1a1622', m: mix(c.skin, '#ff6f8a', 0.45), M: '#9b3b4f', t: c.top, T: mix(c.top, '#101020', 0.3), p: c.pants || '#3b4a6b', b: '#2a2230' };
}
function drawChar(c, x, y, pose, { rot = false, rows = 24 } = {}) {
  const g = makeChar(c, pose), pal = palette(c);
  for (let j = 0; j < rows; j++) for (let i = 0; i < 16; i++) {
    const k = g[j][i]; if (!k) continue;
    if (rot) px(x + j, y + 15 - i, pal[k]); else px(x + i, y + j, pal[k]);
  }
}

// ---------- icons ----------
const ICONS = {
  prev: ['..#...#', '.##..##', '###.###', '.##..##', '..#...#'],
  rec: ['.###.', '#####', '#####', '#####', '.###.'],
  heart: ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'],
  rose: ['.#.#.', '#####', '.###.', '..#..', '.##..', '..#..'],
  choc: ['#######', '#.#.#.#', '#######', '#.#.#.#', '#######'],
  car: ['..####..', '.#.#..#.', '########', '########', '.##..##.'],
  zzz: ['###....', '..#....', '.#.###.', '###..#.', '....#..', '....###'],
  pot: ['.#.#.#.', '#.#.#..', '.......', '#######', '.#####.', '.#####.'],
  laptop: ['.#####.', '.#...#.', '.#...#.', '.#####.', '#######'],
  book: ['.##.##.', '#..#..#', '#..#..#', '#..#..#', '#######'],
  note: ['...###', '...#.#', '...#..', '.###..', '####..', '.##...'],
  plant: ['#..#..#', '.#.#.#.', '..###..', '.#####.', '.#####.', '..###..'],
  dumbbell: ['#.....#', '##...##', '#######', '##...##', '#.....#'],

async function sendGift(p, kind, note) {
  if (!p) return;
  const g = GIFT_KINDS.find((x) => x.kind === kind);
  if (DEMO() || p.npc) {
    closeDialog();
    toast(`${g.label} on the way to ${p.name}!`);
    const replies = p.npc ? NEIGHBOR_REPLIES : DEMO_REPLIES;
    setTimeout(() => toast(`${p.name}: "${replies[Math.floor(Math.random() * replies.length)]}"`, 5000), 4500);
    return;
  }
  try {
    await sendGiftLive(p, kind, note);
    closeDialog(); toast(`${g.label} on the way to ${p.name}! They'll see you walk over.`);
  } catch (e) { writeFailed(e); }
}
function startNextDelivery() {
  if (state.delivering || dlg.open || !state.incoming.length || !items.length) return;
  const g = state.incoming.shift();
  const from = state.people.get(g.from); if (!from) return startNextDelivery();
  const meItem = items.find((i) => i.isMe); if (!meItem) return;
  stopDriving();
  state.targetScroll = clampScroll(meItem.x - 10);
  const stopX = meItem.x + meItem.w - 6;
  state.delivering = { gift: g, from, look: from.look, kind: g.kind, x: stopX + Math.max(90, Math.min(170, viewW * 0.6)), stopX, arrived: false };
  refreshSprites();
  const label = GIFT_KINDS.find((k) => k.kind === g.kind)?.label.toLowerCase();
  toast(`${from.name} is walking over with ${g.kind === 'howareyou' ? 'a little note' : label}…`, 4000);
}
function arrive(d) {
  const g = d.gift, from = d.from;
  const reply = el('input', { id: 'f-reply', maxlength: 80, placeholder: 'write back…' });
  let done = false;
  const finish = async (withReply) => {
    if (done) return; done = true;
    const text = withReply ? reply.value.trim() : '';
    closeDialog();
    if (DEMO()) { if (text) toast(`Sent to ${from.name}.`); return; }
    try { await markGiftSeen(g, text); if (text) toast(`Sent to ${from.name}.`); }
    catch (e) { writeFailed(e); }
  };
  const what = g.kind === 'flowers' ? 'brought you flowers!' : g.kind === 'chocolates' ? 'brought you chocolates!' : 'stopped by to ask how you are.';
  openDialog([
    el('h2', {}, `${from.name} ${what}`),
    g.note ? el('p', {}, `“${g.note}”`) : null,
    el('div', { class: 'field' }, el('label', { for: 'f-reply' }, g.kind === 'howareyou' ? 'How are you, really?' : 'Say thanks'), reply),
    el('div', { class: 'row' }, el('button', { class: 'pbtn', type: 'button', onclick: () => finish(false) }, 'Just smile'), el('button', { class: 'pbtn go', type: 'button', onclick: () => finish(true) }, 'Send back')),
  ], () => { state.delivering = null; sprites.walk = []; setTimeout(startNextDelivery, 800); finish(false).catch(() => {}); });
}
function showReplies() {
  for (const g of state.replies) {
    if (state.seenReplies.has(g.id)) continue;
    state.seenReplies.add(g.id); store.set('fs:seenReplies', [...state.seenReplies].slice(-200));
    const p = state.people.get(g.to);
    toast(`${p?.name || 'A friend'} wrote back: "${g.reply}"`, 7000);
  }
}

// Data: a real street on this server (no accounts), or the demo street
// =====================================================================
const CODE = (location.pathname.match(/^\/s\/([A-Za-z0-9]+)/) || [])[1] || null;
let circle = null; // { id, code, name }
let ident = null;  // { friendId, token } remembered in this browser
async function api(path, { method = 'GET', body } = {}) {
  const headers = {};
  if (ident) { headers['x-friend-id'] = ident.friendId; headers['x-friend-token'] = ident.token; }
  if (body !== undefined) headers['content-type'] = 'application/json';
  const res = await fetch(`/api${path}`, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || `Request failed (${res.status})`), { status: res.status });
  return data;
}
function writeFailed(e) { toast(e?.message && e.status ? e.message : 'Couldn\'t reach the street just now. Check your connection and try again.'); }
function toPerson(f) { return { ...f, look: { ...DEFAULT_LOOK, ...(f.look || {}) }, tz: f.tz || 'UTC', activity: f.activity || 'chill' }; }
async function saveMe(rec) {
  const clean = { name: String(rec.name || '').slice(0, 14), look: rec.look, city: String(rec.city || '').slice(0, 14), tz: rec.tz || MY_TZ, activity: rec.activity || 'chill', msg: String(rec.msg || '').slice(0, 70), msgAt: rec.msgAt || 0, joinedAt: rec.joinedAt || Date.now() };
  if (DEMO()) {
    state.me = { id: 'me', ...clean }; state.people.set('me', state.me); store.set('fs:demo-me', state.me); dirty = true; refreshSprites();
    // first post on the demo street: show what receiving a gift feels like
    if (clean.msgAt && !store.get('fs:demo-gift', false)) { store.set('fs:demo-gift', true); setTimeout(() => state.incoming.push({ id: 'demo', from: 'd-asha', kind: 'flowers', note: 'saw these and thought of you!!' }), 2500); }
    return true;
  }
  try {
    if (!ident) {
      const j = await api(`/circles/${circle.id}/join`, { method: 'POST', body: { name: clean.name } });
      ident = { friendId: j.friendId, token: j.token };
      store.set(`fs:me:${circle.id}`, ident);
      openEvents();
    }
    const answered = rec.msgAt && rec.msgAt !== state.me?.msgAt;
    const f = await api(`/circles/${circle.id}/me`, { method: 'PUT', body: { ...clean, answered } });
    state.me = toPerson(f); state.people.set(f.id, state.me);
    rememberStreet();
    dirty = true; refreshSprites(); return true;
  } catch (e) { writeFailed(e); return false; }
}
function rememberStreet() {
  const list = store.get('fs:streets', []).filter((s) => s.code !== circle.code);
  list.unshift({ code: circle.code, name: circle.name });
  store.set('fs:streets', list.slice(0, 10));
}
let events = null;
function openEvents() {
  events?.close();
  const q = ident ? `?friend=${encodeURIComponent(ident.friendId)}&token=${encodeURIComponent(ident.token)}` : '';
  events = new EventSource(`/api/circles/${circle.id}/events${q}`);
  events.onmessage = (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.type === 'friend-joined' || ev.type === 'friend-updated') {
      const p = toPerson(ev.friend);
      const isNew = !state.people.has(p.id);
      state.people.set(p.id, p);
      if (ident && p.id === ident.friendId) state.me = p;
      else if (ev.type === 'friend-updated' && p.msgAt && Date.now() - p.msgAt < 15000) toast(`${p.name}: "${p.msg}"`);
      else if (isNew && p.name) toast(`${p.name} moved onto the street!`);
      dirty = true;
    } else if (ev.type === 'gift') {
      if (!state.incoming.some((x) => x.id === ev.gift.id)) state.incoming.push(ev.gift);
    } else if (ev.type === 'gift-reply') {
      state.replies = [ev.gift]; showReplies();
    }
  };
}
async function sendGiftLive(p, kind, note) {
  return api(`/circles/${circle.id}/gifts`, { method: 'POST', body: { to: p.id, kind, note } });
}
async function markGiftSeen(g, reply) {
  return api(`/circles/${circle.id}/gifts/${g.id}/seen`, { method: 'POST', body: { reply } });
}

  state.people.set('me', state.me);

  document.getElementById('note').replaceChildren('Demo street: the friends here are samples and your answers stay in this browser. ',
    el('button', { onclick: openWelcome }, 'Start a real street with your friends'));

async function startLive() {

  if (location.pathname !== `/s/${circle.code}`) history.replaceState(null, '', `/s/${circle.code}`);
  state.mode = 'live';
  state.streetName = circle.name;
  ident = store.get(`fs:me:${circle.id}`, null);
  if (ident && !circle.friends.some((f) => f.id === ident.friendId)) ident = null;
  state.people = new Map(circle.friends.filter((f) => f.name).map((f) => [f.id, toPerson(f)]));
  state.me = ident ? state.people.get(ident.friendId) || null : null;
  document.getElementById('title').textContent = `${circle.name.toUpperCase().replace(/\s+/g, '_')}.LYF`;
  document.title = `${circle.name} · Friends Street`;
  document.getElementById('note').replaceChildren(`Invite code ${circle.code}. Anyone with the link can move in, no account needed. `, el('button', { onclick: openInvite }, 'Invite friends'), ' · ', el('button', { onclick: () => { location.href = '/'; } }, 'Demo street'));
  openEvents();
  dirty = true; ready();
  if (!state.me) setTimeout(() => openJoin(), 500);
  else {
    rememberStreet();
    const fresh = state.me.msgAt && localDate(MY_TZ) === localDate(MY_TZ) && new Date(state.me.msgAt).toDateString() === new Date().toDateString();
    if (!fresh) setTimeout(() => openUpdate(), 500);
    try {
      const g = await api(`/circles/${circle.id}/gifts`);
      for (const x of g.incoming) if (!state.incoming.some((y) => y.id === x.id)) state.incoming.push(x);
      state.replies = g.replies; showReplies();
    } catch { /* gifts can wait */ }
  }
}
let fontsReady = false;
function ready() { document.getElementById('loading').hidden = true; updateLcd(); }
async function boot() {
  resize();
  window.addEventListener('resize', () => { resize(); });
  try { await Promise.race([Promise.all([document.fonts.load('20px "VT323"'), document.fonts.load('20px "Silkscreen"')]), new Promise((r) => setTimeout(r, 3000))]); } catch { /* fallback fonts */ }
  fontsReady = true; dirty = true;
  requestAnimationFrame(frame);
  setInterval(() => { dirty = true; }, 60000); // clocks and sky follow real time
  setInterval(startNextDelivery, 1000);
  if (CODE && CODE.toLowerCase() !== 'demo') await startLive();
  else startDemo(!store.get('fs:demo-me', null) && !CODE);
}
boot();
</script>
